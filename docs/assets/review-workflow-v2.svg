<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320"><style>text{font-family:'PingFang SC','Heiti SC',sans-serif}</style><rect x="0" y="0" width="1600" height="1320" rx="0" fill="#F5F8FB" stroke="none"/><text x="64" y="65" fill="#3262D9" font-size="21" font-weight="700">02 / HUMAN-IN-THE-LOOP REVIEW</text><text x="64" y="132" fill="#16283D" font-size="48" font-weight="700">一个分数，怎样变成可确认的评审结果</text><text x="64" y="181" fill="#586D80" font-size="26" font-weight="400">材料、评分尝试与人工决定分别记录，最后明确输出采用了哪一个版本。</text><rect x="64" y="240" width="468" height="338" rx="18" fill="#fff" stroke="#D8E2EA"/><rect x="88" y="262" width="56" height="40" rx="8" fill="#EAF0FE" stroke="none"/><text x="98" y="291" fill="#3262D9" font-size="23" font-weight="700">01</text><text x="88" y="348" fill="#16283D" font-size="33" font-weight="700">材料准备</text><text x="88" y="403" fill="#586D80" font-size="26" font-weight="400">登记材料包与版本</text><text x="88" y="448" fill="#586D80" font-size="26" font-weight="400">校验来源、输入和证据</text><text x="88" y="493" fill="#586D80" font-size="26" font-weight="400">核对隐私与输入许可</text><rect x="88" y="521" width="420" height="38" rx="8" fill="#EAF0FE" stroke="none"/><text x="102" y="548" fill="#3262D9" font-size="23" font-weight="500">import → validate</text><rect x="566" y="240" width="468" height="338" rx="18" fill="#fff" stroke="#D8E2EA"/><rect x="590" y="262" width="56" height="40" rx="8" fill="#EAF0FE" stroke="none"/><text x="600" y="291" fill="#3262D9" font-size="23" font-weight="700">02</text><text x="590" y="348" fill="#16283D" font-size="33" font-weight="700">固定评分标准</text><text x="590" y="403" fill="#586D80" font-size="26" font-weight="400">绑定 rubric / Prompt</text><text x="590" y="448" fill="#586D80" font-size="26" font-weight="400">核对输入与输出格式</text><text x="590" y="493" fill="#586D80" font-size="26" font-weight="400">记录配置指纹与版本</text><rect x="590" y="521" width="420" height="38" rx="8" fill="#EAF0FE" stroke="none"/><text x="604" y="548" fill="#3262D9" font-size="23" font-weight="500">同批任务保持评价口径</text><rect x="1068" y="240" width="468" height="338" rx="18" fill="#fff" stroke="#D8E2EA"/><rect x="1092" y="262" width="56" height="40" rx="8" fill="#EAF0FE" stroke="none"/><text x="1102" y="291" fill="#3262D9" font-size="23" font-weight="700">03</text><text x="1092" y="348" fill="#16283D" font-size="33" font-weight="700">AI 候选结果</text><text x="1092" y="403" fill="#586D80" font-size="26" font-weight="400">生成维度分与评语</text><text x="1092" y="448" fill="#586D80" font-size="26" font-weight="400">保留尝试和结果快照</text><text x="1092" y="493" fill="#586D80" font-size="26" font-weight="400">重试产生新的尝试</text><rect x="1092" y="521" width="420" height="38" rx="8" fill="#EAF0FE" stroke="none"/><text x="1106" y="548" fill="#3262D9" font-size="23" font-weight="500">score → review</text><rect x="1068" y="675" width="468" height="338" rx="18" fill="#fff" stroke="#D8E2EA"/><rect x="1092" y="697" width="56" height="40" rx="8" fill="#E7F4F0" stroke="none"/><text x="1102" y="726" fill="#087F78" font-size="23" font-weight="700">04</text><text x="1092" y="783" fill="#16283D" font-size="33" font-weight="700">人工复核</text><text x="1092" y="838" fill="#586D80" font-size="26" font-weight="400">对照材料检查候选结果</text><text x="1092" y="883" fill="#586D80" font-size="26" font-weight="400">异常进入复核工单</text><text x="1092" y="928" fill="#586D80" font-size="26" font-weight="400">强制复核阻止自动采用</text><rect x="1092" y="956" width="420" height="38" rx="8" fill="#E7F4F0" stroke="none"/><text x="1106" y="983" fill="#087F78" font-size="23" font-weight="500">判断问题，登记处理决定</text><rect x="566" y="675" width="468" height="338" rx="18" fill="#fff" stroke="#D8E2EA"/><rect x="590" y="697" width="56" height="40" rx="8" fill="#E7F4F0" stroke="none"/><text x="600" y="726" fill="#087F78" font-size="23" font-weight="700">05</text><text x="590" y="783" fill="#16283D" font-size="33" font-weight="700">采用与最终锁定</text><text x="590" y="838" fill="#586D80" font-size="26" font-weight="400">采用具体评分版本</text><text x="590" y="883" fill="#586D80" font-size="26" font-weight="400">记录决定与结果关联</text><text x="590" y="928" fill="#586D80" font-size="26" font-weight="400">锁定已确认的最终结果</text><rect x="590" y="956" width="420" height="38" rx="8" fill="#E7F4F0" stroke="none"/><text x="604" y="983" fill="#087F78" font-size="23" font-weight="500">人工保留最终判断</text><rect x="64" y="675" width="468" height="338" rx="18" fill="#fff" stroke="#D8E2EA"/><rect x="88" y="697" width="56" height="40" rx="8" fill="#EAF0FE" stroke="none"/><text x="98" y="726" fill="#3262D9" font-size="23" font-weight="700">06</text><text x="88" y="783" fill="#16283D" font-size="33" font-weight="700">推导权威结果</text><text x="88" y="838" fill="#586D80" font-size="26" font-weight="400">优先读取人工最终锁定</text><text x="88" y="883" fill="#586D80" font-size="26" font-weight="400">检查快照与关联记录</text><text x="88" y="928" fill="#586D80" font-size="26" font-weight="400">检查未结案阻断工单</text><rect x="88" y="956" width="420" height="38" rx="8" fill="#EAF0FE" stroke="none"/><text x="102" y="983" fill="#3262D9" font-size="23" font-weight="500">条件满足后输出 JSON</text><path d="M534 408 L558 408" fill="none" stroke="#3262D9" stroke-width="3"/><path d="M549 401 L558 408 L549 415" fill="none" stroke="#3262D9" stroke-width="3"/><path d="M1036 408 L1060 408" fill="none" stroke="#3262D9" stroke-width="3"/><path d="M1051 401 L1060 408 L1051 415" fill="none" stroke="#3262D9" stroke-width="3"/><path d="M1302 578 V650" fill="none" stroke="#087F78" stroke-width="3"/><path d="M1295 641 L1302 650 L1309 641" fill="none" stroke="#087F78" stroke-width="3"/><path d="M1060 843 H1036" fill="none" stroke="#087F78" stroke-width="3"/><path d="M1045 836 L1036 843 L1045 850" fill="none" stroke="#087F78" stroke-width="3"/><path d="M558 843 H534" fill="none" stroke="#087F78" stroke-width="3"/><path d="M543 836 L534 843 L543 850" fill="none" stroke="#087F78" stroke-width="3"/><text x="66" y="624" fill="#3262D9" font-size="23" font-weight="700">前半段：确认输入与候选结果</text><text x="567" y="624" fill="#087F78" font-size="23" font-weight="700">后半段：保留人工判断与输出依据</text><rect x="64" y="1060" width="1472" height="157" rx="17" fill="#FFF3DF" stroke="none"/><text x="92" y="1107" fill="#AF6B15" font-size="29" font-weight="700">已锁定 ≠ 可以直接输出</text><text x="92" y="1155" fill="#16283D" font-size="27" font-weight="400">阻断工单未结案 → 拒绝输出；结案后 → 返回人工最终锁定的结果。</text><text x="92" y="1193" fill="#586D80" font-size="23" font-weight="400">本机同案操作已验证这组对照。普通 Excel 仍是独立出口，尚未接入权威结果链路。</text><path d="M64 1252 L1536 1252" fill="none" stroke="#D8E2EA" stroke-width="2"/><text x="64" y="1290" fill="#586D80" font-size="20" font-weight="400">设计说明图；演示分数为预置，未调用真实模型。</text><text x="1110" y="1290" fill="#586D80" font-size="20" font-weight="400">采用 · 锁定 · 结案 · JSON 已验证</text></svg>