[project]
name = "buddy-claw-ai-scoring-system"
version = "1.0.2"
description = "Portable local AI-assisted scoring workflow with synthetic demo data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "python-multipart==0.0.12",
  "sqlalchemy==2.0.36",
  "openpyxl==3.1.5",
  "xlrd==2.0.1",
  "python-docx==1.1.2",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "openai==1.57.0",
  "anthropic==0.39.0",
  "httpx==0.27.0",
  "radon==6.0.1",
  "python-magic-bin==0.4.14; sys_platform == 'win32'",
  "chardet==5.2.0",
  "python-dateutil==2.9.0",
  "pytz==2024.2",
  "rapidocr-onnxruntime==1.2.3",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "onnxruntime==1.29.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "PyMuPDF==1.27.2.3",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "playwright==1.60.0",
]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
