<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">古诗词节奏训练营界面预览</title>
  <desc id="desc">包含诗句、节奏选择、反馈和练习进度的虚构离线界面</desc>
  <rect width="960" height="540" fill="#f7f5f0"/>
  <rect x="0" y="0" width="238" height="540" fill="#31453a"/>
  <text x="34" y="58" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="700">古诗词</text>
  <text x="34" y="92" fill="#d4e1d8" font-family="sans-serif" font-size="19">节奏训练营</text>
  <text x="34" y="160" fill="#b8cabd" font-family="sans-serif" font-size="15">本轮进度</text>
  <rect x="34" y="179" width="164" height="10" rx="5" fill="#60756a"/>
  <rect x="34" y="179" width="108" height="10" rx="5" fill="#e6b85c"/>
  <text x="34" y="224" fill="#ffffff" font-family="sans-serif" font-size="18">2 / 3 题</text>
  <rect x="278" y="54" width="636" height="432" rx="8" fill="#ffffff" stroke="#ded8ca"/>
  <text x="318" y="104" fill="#765a32" font-family="sans-serif" font-size="16">请用 / 标出建议停顿位置</text>
  <text x="318" y="180" fill="#26332c" font-family="serif" font-size="42">春风花草香</text>
  <rect x="318" y="222" width="552" height="60" rx="6" fill="#faf8f2" stroke="#cfc7b5"/>
  <text x="340" y="260" fill="#465249" font-family="sans-serif" font-size="20">春风花 / 草香</text>
  <rect x="318" y="312" width="552" height="76" rx="6" fill="#fff4dc" stroke="#e6b85c"/>
  <text x="340" y="343" fill="#7e5a17" font-family="sans-serif" font-size="17" font-weight="700">再想一想</text>
  <text x="340" y="371" fill="#66583e" font-family="sans-serif" font-size="15">前两个字和后三个字分开：春风 / 花草香</text>
  <rect x="690" y="418" width="180" height="44" rx="6" fill="#31453a"/>
  <text x="741" y="447" fill="#ffffff" font-family="sans-serif" font-size="16">下一题</text>
</svg>
